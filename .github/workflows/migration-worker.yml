name: Migration Worker
run-name: >-
  Migration Worker / ${{
    github.event.client_payload.agent_id ||
    github.run_id
  }} / ${{
    github.event.client_payload.repair_job_id ||
    github.event.client_payload.worker_instance_id ||
    github.run_id
  }}

permissions:
  contents: read

concurrency:
  group: drive-migration-worker-${{ github.event.client_payload.worker_instance_id || github.run_id }}
  cancel-in-progress: true

on:
  repository_dispatch:
    types: [drive-migration-worker]

jobs:
  run-migration-worker:
    if: contains(github.workflow_ref, github.event.client_payload.workflow_file)
    name: Run ${{ github.run_number }} / Worker ${{ github.event.client_payload.worker_instance_id || github.run_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: workers/migration-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.code_ref || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: workers/migration-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate worker configuration
        env:
          SERVER_URL: ${{ secrets.DRIVE_MIGRATION_ORCHESTRATOR_URL }}
          TOKEN: ${{ secrets.DRIVE_WORKER_SHARED_SECRET }}
        run: |
          test -n "$SERVER_URL" || { echo "::error::DRIVE_MIGRATION_ORCHESTRATOR_URL GitHub secret is missing"; exit 1; }
          test -n "$TOKEN" || { echo "::error::DRIVE_WORKER_SHARED_SECRET GitHub secret is missing"; exit 1; }

      - name: Run migration worker
        env:
          SERVER_URL: ${{ secrets.DRIVE_MIGRATION_ORCHESTRATOR_URL }}
          AGENT_ID: ${{ github.event.client_payload.agent_id }}
          WORKER_INSTANCE_ID: ${{ github.event.client_payload.worker_instance_id || github.run_id }}
          DRIVE_MIGRATION_ID: ${{ github.event.client_payload.migration_id }}
          DRIVE_REPAIR_JOB_ID: ${{ github.event.client_payload.repair_job_id || '' }}
          TOKEN: ${{ secrets.DRIVE_WORKER_SHARED_SECRET }}
          EXIT_AFTER_JOB: ${{ github.event.client_payload.repair_job_id && 'true' || 'false' }}
          MAX_RUNTIME_SECONDS: ${{ github.event.client_payload.max_runtime_seconds || '21300' }}
        run: npm start
